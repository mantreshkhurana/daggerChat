[package]
name = "dagger-chat"
version = "0.1.0"
edition = "2021"
authors = ["Mantresh Khurana"]
description = "A blockchain-based secure chat application with terminal UI"
license = "MIT"
repository = "https://github.com/mantreshkhurana/daggerChat"
keywords = ["blockchain", "chat", "ethereum", "encryption", "tui"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
# Async Runtime
tokio = { version = "1.41", features = ["full", "macros", "rt-multi-thread"] }
futures = "0.3"

# Blockchain - Alloy (Ethereum SDK)
alloy = { version = "0.8", features = ["full"] }

# Cryptography
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"

# Terminal UI
ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }

# Serialization
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

# Local Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Configuration
dotenvy = "0.15"
directories = "5.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI Arguments
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.14"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
